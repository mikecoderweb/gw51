<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
      <div class="site-container">
    <!-- Header -->
    <header>
      <div class="logo">
        <span class="logo-icon"></span>
        <span>Sama</span>
      </div>
      <nav>
        <a href="#">Home</a>
        <a href="#">How It Works</a>

        <a href="#">About Us</a>
        <a href="#">Coach</a>

        </div>

        <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?q=80&w=1000&auto=format&fit=crop" alt="Woman holding smartphone">
